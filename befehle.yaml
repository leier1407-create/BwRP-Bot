# =====================================================================
#  befehle.yaml – ALLE Befehle, Texte, Symbole und Pings an einem Ort
# =====================================================================
#  befehle:        Jeder Slash-Befehl. Du kannst ändern:
#                    name         neuer Name (klein, ohne Leerzeichen)
#                    beschreibung Text, der in Discord unter dem Befehl steht
#                    aktiv        false = Befehl ausblenden
#                    stufe        jeder / support / moderator / admin / ... (siehe config.yaml)
#                                 Bei einer GRUPPE (z. B. "mod") gilt die Stufe für alle Unterbefehle.
#                    rollen       Liste von Rollennamen oder IDs – NUR diese Rollen dürfen den Befehl
#                    cooldown     Sekunden Wartezeit pro Person
#  eigene_befehle: Eigene Befehle mit fester Antwort (z. B. /regeln)
#  pings:          Rollen, die bei Ereignissen gepingt werden (Rollenname, ID, "everyone" oder "here")
#  texte:          Alle Nachrichten, Titel, Buttons und Symbole.
#                  Wörter in {geschweiften Klammern} sind Platzhalter – nicht umbenennen.
#
#  Nach Änderungen in Discord: /befehle neuladen   (oder den Bot neu starten)
# =====================================================================

